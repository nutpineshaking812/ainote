name: Build & Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ainote

jobs:
  # ── Step 1: Detect which services' files changed ──
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      postgres: ${{ steps.filter.outputs.postgres }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'server/**'
              - '1shared/**'
            frontend:
              - 'client/**'
              - '1shared/**'
            postgres:
              - 'docker/postgres/**'
            python:
              - 'python/**'

  # ── Step 2: Build only changed services ──
  build:
    needs: changes
    # Always build on workflow_dispatch (manual trigger),
    # otherwise only build if that service's files changed
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.postgres == 'true' ||
      needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: postgres
            context: ./docker/postgres
            dockerfile: docker/postgres/Dockerfile
            changed: ${{ needs.changes.outputs.postgres }}
          - name: backend
            context: .
            dockerfile: server/Dockerfile
            changed: ${{ needs.changes.outputs.backend }}
          - name: frontend
            context: .
            dockerfile: client/Dockerfile
            changed: ${{ needs.changes.outputs.frontend }}
          - name: python
            context: ./python
            dockerfile: python/Dockerfile
            changed: ${{ needs.changes.outputs.python }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Skip unchanged service
        if: github.event_name != 'workflow_dispatch' && matrix.service.changed != 'true'
        run: |
          echo "⏭️ Skipping ${{ matrix.service.name }} (no changes detected)"
          echo "SKIP=true" >> $GITHUB_ENV

      - name: Checkout
        if: env.SKIP != 'true'
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: env.SKIP != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: env.SKIP != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.SKIP != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (${{ matrix.service.name }})
        if: env.SKIP != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
